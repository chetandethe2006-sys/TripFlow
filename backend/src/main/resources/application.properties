# ================================
# TripFlow Backend Configuration
# ================================

# Application & Server Port (Binds to Render's dynamic PORT and 0.0.0.0)
spring.application.name=tripflow-backend
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}

# Database Configuration (PostgreSQL when DB_URL/SPRING_DATASOURCE_URL is set, persistent file database by default)
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/tripflow;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:sa}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=${DB_DRIVER:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Email Configuration
spring.mail.host=${SMTP_HOST:smtp.example.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# TripFlow App Configuration
tripflow.owner.email=${OWNER_EMAIL:owner@tripflow.com}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:5501,http://127.0.0.1:5501,https://*.onrender.com}
