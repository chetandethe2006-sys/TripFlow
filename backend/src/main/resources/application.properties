# ================================
# TripFlow Backend Configuration
# ================================

# Application
spring.application.name=tripflow-backend
server.port=8080

# Database Configuration (PostgreSQL when DB_URL is set, persistent file database by default)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/tripflow;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true