# ==============================================================================
# Render Blueprint Specification for TripFlow
# Deploy via: Render Dashboard -> Blueprints -> New Blueprint Instance
# ==============================================================================
version: "1"

services:
  # ----------------------------------------------------------------------------
  # Full-Stack Web Service (Spring Boot Backend with Embedded Frontend)
  # ----------------------------------------------------------------------------
  - type: web
    name: tripflow-app
    runtime: java
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/tripflow-backend-0.0.1-SNAPSHOT.jar
    healthCheckPath: /api/test
    envVars:
      - key: JAVA_VERSION
        value: 21
      - key: SERVER_ADDRESS
        value: 0.0.0.0
      # Database connection:
      # Defaults to persistent H2 file database.
      # To switch to Render PostgreSQL, update DB_URL to your JDBC connection string:
      # jdbc:postgresql://<host>:5432/<dbname>
      - key: DB_URL
        value: jdbc:h2:file:./data/tripflow;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
      - key: JWT_SECRET
        generateValue: true
      - key: OWNER_EMAIL
        value: owner@tripflow.com
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:5500,http://127.0.0.1:5500,https://*.onrender.com"
