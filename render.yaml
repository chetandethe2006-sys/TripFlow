# ==============================================================================
# Render Blueprint Specification for TripFlow
# Schema Version: 1
# Deploy via: Render Dashboard -> Blueprints -> New Blueprint Instance
# ==============================================================================
version: "1"

services:
  # ----------------------------------------------------------------------------
  # 1. Backend Web Service (Java 21 Spring Boot in Docker)
  # ----------------------------------------------------------------------------
  - type: web
    name: tripflow-backend
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/test
    envVars:
      - key: SERVER_ADDRESS
        value: "0.0.0.0"
      - key: JWT_SECRET
        generateValue: true
      - key: OWNER_EMAIL
        value: "owner@tripflow.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:5500,http://127.0.0.1:5500,https://*.onrender.com"
      # Database connection:
      # Defaults to embedded H2 file database.
      # To switch to Render Managed PostgreSQL, set DB_URL to:
      # jdbc:postgresql://<host>:5432/<dbname>
      - key: DB_URL
        value: "jdbc:h2:file:./data/tripflow;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1"

  # ----------------------------------------------------------------------------
  # 2. Frontend Static Site (HTML5 / Tailwind CSS / Vanilla JS)
  # ----------------------------------------------------------------------------
  - type: static
    name: tripflow-frontend
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: ""
    publishDir: "."
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    headers:
      - path: "/*"
        name: "Access-Control-Allow-Origin"
        value: "*"

# ------------------------------------------------------------------------------
# Optional: Render Managed PostgreSQL Database (Free tier available)
# To enable persistent cloud PostgreSQL instead of ephemeral H2:
# 1. Uncomment the 'databases' block below.
# 2. In tripflow-backend envVars, point DB_URL to your PostgreSQL instance.
# ------------------------------------------------------------------------------
# databases:
#   - name: tripflow-postgres
#     plan: free
#     region: oregon
#     databaseName: tripflow
#     user: tripflow
